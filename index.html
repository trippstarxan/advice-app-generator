<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
  <title>Frontend Mentor | Advice generator app</title>
</head>
<body>
  <main>
    <article class="card" aria-live="polite" aria-busy="false">
      <h1 class="card__id">Advice #<span id="advice-id">117</span></h1>
      <blockquote class="card__text">
        <p id="advice-text">&ldquo;It is easy to sit up and take notice, what's difficult is getting up and taking action.&rdquo;</p>
      </blockquote>

      <picture class="card__divider">
        <source media="(min-width: 600px)" srcset="./images/pattern-divider-desktop.svg">
        <img src="./images/pattern-divider-mobile.svg" alt="" width="295" height="16">
      </picture>

      <button class="card__btn" id="dice-btn" type="button" aria-label="Generate new advice">
        <img src="./images/icon-dice.svg" alt="" width="24" height="24">
      </button>
    </article>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Your Name Here</a>.
  </footer>

  <script src="./script.js"></script>
</body>
</html>
